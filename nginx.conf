server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Prevent absolute redirects from including :8080
    absolute_redirect off;
    port_in_redirect off;

    # The site has no homepage of its own; send the root to the first product
    # with a real redirect instead of an empty page that redirects in the browser.
    location = / {
        return 301 /business-app/$is_args$args;
    }

    # Strip the old /docs prefix. Permanent, and straight to the slash form
    # every page is served at, so a legacy link lands in one hop.
    location = /docs {
        return 301 /business-app/;
    }
    location = /docs/ {
        return 301 /business-app/;
    }
    location ~ ^/docs/(.*?)/?$ {
        return 301 /$1/;
    }

    # "My meetings" was renamed to my-meetings so its addresses have no space.
    # nginx matches the decoded path, so %20 arrives here as a space.
    location ~ "^/business-app/crm/My meetings/?$" {
        return 301 /business-app/crm/my-meetings/;
    }
    location ~ "^/business-app/crm/My meetings/(.+?)/?$" {
        return 301 /business-app/crm/my-meetings/$1/;
    }

    # Pages. Docusaurus builds every route as <route>/index.html, so an
    # address with nothing behind it is a real 404, not the homepage.
    # No add_header here: one in a location would discard the server-level
    # security headers, and `expires` already sets Cache-Control.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires 1h;
    }

    # Static assets (js, css, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        expires 30d;
    }

    error_page 404 /404.html;

    # Security headers; `always` keeps them on 404s and other error responses.
    # TLS ends at Cloud Run, so HSTS is set here; browsers ignore it over
    # plain HTTP. No X-XSS-Protection: browsers retired it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
